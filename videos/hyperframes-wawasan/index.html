<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Wawasan / HyperFrames Experimental Motion</title>
<script src="./node_modules/gsap/dist/gsap.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#291A17}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
  .clip{position:absolute;inset:0;overflow:hidden}
  #background-panel{position:absolute;inset:0;background:radial-gradient(circle at 57% 40%,#493029 0%,#291A17 58%,#170E0D 100%)}
  #ring{position:absolute;top:320px;left:95px;width:875px;height:875px;border-radius:50%;border:45px solid rgba(244,165,28,.55)}
  #ring-small{position:absolute;top:530px;left:310px;width:450px;height:450px;border-radius:50%;border:8px solid rgba(248,234,209,.55)}
  #route{position:absolute;top:400px;left:105px;width:865px;height:1000px}
  #title{position:absolute;left:75px;top:172px;max-width:925px;font-size:132px;line-height:.9;letter-spacing:-6px;font-weight:900;color:#F8EAD1}
  #subtitle{position:absolute;left:80px;top:1510px;font-size:34px;letter-spacing:4px;font-weight:900;color:#F4A51C}
  #description{position:absolute;left:80px;top:1590px;max-width:800px;font-size:35px;line-height:1.3;font-weight:700;color:#F8EAD1}
  #topline{position:absolute;top:103px;left:75px;color:#E8C9A1;font-size:24px;letter-spacing:6px;font-weight:800}
  #bottomline{position:absolute;bottom:94px;left:80px;right:80px;height:2px;background:rgba(248,234,209,.35)}
</style>
</head>
<body>
<div id="root" data-composition-id="wawasan-hyperframes" data-start="0"
 data-duration="4" data-width="1080" data-height="1920" data-fps="30">
 <div id="background-clip" class="clip" data-start="0" data-duration="4" data-track-index="0">
  <div id="background-panel"></div>
 </div>
 <div id="geometry-clip" class="clip" data-start="0" data-duration="4" data-track-index="1">
  <div id="ring"></div><div id="ring-small"></div>
  <svg id="route" viewBox="0 0 865 1000" aria-hidden="true">
   <path id="route-line" d="M 25 750 C 140 705 85 450 225 405 C 340 355 430 610 565 390 C 650 275 615 170 810 100"
    fill="none" stroke="#F4A51C" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
 </div>
 <div id="typography-clip" class="clip" data-start="0" data-duration="4" data-track-index="2">
  <div id="topline">RESTORAN WAWASAN • MOTION LAB</div>
  <div id="title">ONE TAP.<br>NEW SPACE.</div>
  <div id="subtitle">3D / KINETIC / MAP</div>
  <div id="description">An experimental layout, not a screenshot of the Wawasan app.</div>
  <div id="bottomline"></div>
 </div>
</div>
<script>
  // Deterministic timeline: no window time, no network access or random state.
  const tl = gsap.timeline({paused:true});
  const route = document.getElementById("route-line");
  const length = route.getTotalLength();
  tl.fromTo("#title",{y:110,opacity:0},{y:0,opacity:1,duration:.58,ease:"power3.out"},0.16);
  tl.fromTo("#ring",{scale:.75,opacity:0,rotation:-65},{scale:1,opacity:1,rotation:18,duration:1.65,ease:"power3.out"},0.08);
  tl.fromTo("#ring-small",{scale:.7,opacity:0},{scale:1,opacity:.85,duration:1.1,ease:"power2.out"},0.47);
  tl.fromTo(route,{strokeDasharray:length,strokeDashoffset:length},{strokeDashoffset:0,duration:2.4,ease:"power2.inOut"},0.65);
  tl.fromTo("#subtitle",{y:65,opacity:0},{y:0,opacity:1,duration:.48,ease:"power3.out"},2.12);
  tl.fromTo("#description",{y:40,opacity:0},{y:0,opacity:1,duration:.48,ease:"power3.out"},2.36);
  window.__timelines=window.__timelines||{};
  window.__timelines["wawasan-hyperframes"]=tl;
</script>
</body>
</html>
