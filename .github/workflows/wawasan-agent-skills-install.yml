name: Install Wawasan UIUX and Remotion skills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wawasan-agent-skills-install.yml'
      - 'scripts/install-video-agent-skills.sh'

# Temporary write scope for publishing verified skills; revert to read-only.
permissions:
  contents: read

jobs:
  install-skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch complete pinned skill sources
        run: bash scripts/install-video-agent-skills.sh
      - name: Validate UI UX search and Remotion references
        run: |
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py \
            "mobile food ordering interactions" --domain ux > /tmp/wawasan-ux-search.txt
          test -s /tmp/wawasan-ux-search.txt
          grep -qi 'remotion' .agents/skills/remotion-best-practices/SKILL.md
      - name: Confirm installed skill trees match pinned upstream
        run: |
          git diff --exit-code -- .agents/skills/ui-ux-pro-max .agents/skills/remotion-best-practices
          test -s .agents/skills/MOTION_ADDONS_SOURCES.md
