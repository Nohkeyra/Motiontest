name: Wawasan signed APK bundle to motion proof
on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: 'Signed APK release tag'
        type: string
        required: true
        default: 'v1.3.225'
  push:
    branches: [main]
    paths:
      - '.github/workflows/wawasan-authentic-proof.yml'
      - 'scripts/extract-apk-webview.sh'
      - 'scripts/capture-apk-webview.mjs'
      - 'scripts/verify.py'
      - 'videos/wawasan-authentic/**'
permissions:
  contents: read
jobs:
  apk-webview:
    name: Capture released APK bundled frontend automatically
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract exact compiled web assets from signed APK
        env:
          APK_TAG: ${{ inputs.apk_tag || 'v1.3.225' }}
        run: bash scripts/extract-apk-webview.sh
      - name: Install headless browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.1
          npx playwright install --with-deps chromium
      - name: Capture real APK UI without emulator
        run: |
          cd apk-site/site
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wawasan-http.log 2>&1 &
          webserver_pid=$!
          trap 'kill "$webserver_pid" 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"
          node scripts/capture-apk-webview.mjs
      - name: Verify captured images and provenance
        run: |
          python3 -m pip install --user 'pillow>=10,<12'
          python3 scripts/verify.py capture capture
      - name: Upload screenshots or diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawasan-APK-compiled-UI-captures
          path: capture/
          retention-days: 7
          if-no-files-found: warn

  render:
    needs: apk-webview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: videos/wawasan-authentic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wawasan-APK-compiled-UI-captures
          path: videos/wawasan-authentic/public/frames
      - name: Verify source screenshots
        run: |
          python3 -m pip install --user 'pillow>=10,<12'
          python3 ../../scripts/verify.py capture public/frames
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matched Remotion versions
        run: |
          VERSION="$(npm view remotion version)"
          npm install --no-audit --no-fund --save-exact "remotion@$VERSION" "@remotion/cli@$VERSION" react@19 react-dom@19
      - run: npx remotion browser ensure
      - name: Render original 9-second style proof
        run: npm run render:proof
      - name: Verify MP4 and extract review frames
        run: python3 ../../scripts/verify.py video out/authentic-proof.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: wawasan-original-motion-proof
          retention-days: 14
          if-no-files-found: error
          path: |
            videos/wawasan-authentic/out/authentic-proof.mp4
            videos/wawasan-authentic/out/review-frames/*.png
            videos/wawasan-authentic/public/frames/capture.json
