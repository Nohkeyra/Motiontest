name: Wawasan APK → Beat-Driven Master Cut
on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: 'Signed APK release tag'
        type: string
        required: true
        default: 'v1.3.225'
  push:
    branches: [main]
    paths:
      - 'scripts/extract-apk-webview.sh'
      - 'scripts/capture-apk-webview.mjs'
      - 'scripts/verify.py'
      - 'videos/wawasan-authentic/src/MasterCut.tsx'
      - 'videos/wawasan-authentic/src/WawasanFilm.tsx'
      - 'videos/wawasan-authentic/src/AuthenticProof.tsx'
      - 'scripts/generate-film-score.mjs'
      - 'scripts/prepare-master-beat.sh'
      - 'scripts/prepare-interaction-clips.py'
      - 'scripts/music-beat-grid.py'
permissions:
  contents: read
jobs:
  apk-webview:
    name: Capture released APK bundled frontend automatically
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract exact compiled web assets from signed APK
        env:
          APK_TAG: ${{ inputs.apk_tag || 'v1.3.225' }}
        run: bash scripts/extract-apk-webview.sh
      - name: Install headless browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.1
          npx playwright install --with-deps chromium
      - name: Capture real APK UI without emulator
        run: |
          cd apk-site/site
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wawasan-http.log 2>&1 &
          webserver_pid=$!
          trap 'kill "$webserver_pid" 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"
          node scripts/capture-apk-webview.mjs
      - name: Verify captured images and provenance
        run: |
          python3 -m pip install --user 'pillow>=10,<12'
          python3 scripts/verify.py capture capture
      - name: Upload screenshots or diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawasan-APK-compiled-UI-captures
          path: capture/
          retention-days: 7
          if-no-files-found: warn

  render:
    needs: apk-webview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: videos/wawasan-authentic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wawasan-APK-compiled-UI-captures
          path: videos/wawasan-authentic/public/frames
      - name: Verify source screenshots
        run: |
          python3 -m pip install --user 'pillow>=10,<12'
          python3 ../../scripts/verify.py capture public/frames
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg and audio analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user 'numpy>=1.26,<3'
      - name: Cut real UI interaction clips
        run: python3 ../../scripts/prepare-interaction-clips.py public/frames
      - name: Download licensed high-energy beat, analyze pulse and snap edits
        run: |
          bash ../../scripts/prepare-master-beat.sh
          python3 ../../scripts/music-beat-grid.py .
      - name: Install reproducible video dependencies
        run: npm ci --no-audit --no-fund
      - run: npx remotion browser ensure
      - name: Render beat-driven 30-second master cut
        run: npm run render:master
      - name: Report FFmpeg version
        run: ffprobe -version | head -n 1
      - name: Verify MP4 and extract review frames
        run: python3 ../../scripts/verify.py video out/wawasan-master-cut.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wawasan-beat-driven-master-cut
          retention-days: 14
          if-no-files-found: error
          path: |
            videos/wawasan-authentic/out/wawasan-master-cut.mp4
            videos/wawasan-authentic/out/review-frames/*.png
            videos/wawasan-authentic/public/frames/capture.json
